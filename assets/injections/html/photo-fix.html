<!-- "Fix an old photo", from js/photo-fix.js: the button under the "What's on
     your mind" box, and the window it opens. Only one [data-step] shows at a time. -->
<button type="button" class="kw-photo-fix-open">
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"></rect><circle cx="9" cy="11" r="2"></circle><path d="m21 16-5-5-8 9"></path><path d="M18 2v4"></path><path d="M16 4h4"></path></svg>
  <span>Fix an old photo</span>
</button>

<div class="kw-photo-fix" role="dialog" aria-modal="true" aria-label="Fix an old photo">
  <div class="kw-photo-fix__panel">
    <div class="kw-photo-fix__header">
      <h2 class="kw-photo-fix__title">Fix an old photo</h2>
      <button type="button" class="kw-photo-fix__close" data-action="close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6 6 18"></path></svg>
      </button>
    </div>

    <input type="file" accept="image/*" class="kw-photo-fix__file" hidden>

    <div data-step="choose">
      <p class="kw-photo-fix__text">Choose a picture of an old photo. We'll make it clearer, take away scratches and marks, and can add colour if it's black and white.</p>
      <div class="kw-photo-fix__actions">
        <button type="button" class="kw-photo-fix__button kw-photo-fix__button--main" data-action="choose">Choose a photo</button>
      </div>
    </div>

    <div data-step="ready">
      <img class="kw-photo-fix__image" data-image="picked" alt="The photo you chose">
      <label class="kw-photo-fix__option">
        <input type="checkbox" data-option="colour">
        <span>Add colour</span>
      </label>
      <div class="kw-photo-fix__actions">
        <button type="button" class="kw-photo-fix__button kw-photo-fix__button--main" data-action="fix">Fix my photo</button>
        <button type="button" class="kw-photo-fix__button" data-action="choose">Choose a different photo</button>
      </div>
    </div>

    <div data-step="working">
      <img class="kw-photo-fix__image" data-image="progress" alt="Your photo, being fixed">
      <p class="kw-photo-fix__status" role="status">
        <span class="kw-photo-fix__spinner" aria-hidden="true"></span>
        <span data-status></span>
      </p>
      <p class="kw-photo-fix__hint">This can take up to a minute.</p>
    </div>

    <div data-step="done">
      <div class="kw-photo-fix__compare">
        <figure>
          <img class="kw-photo-fix__image" data-image="before" alt="Your photo before">
          <figcaption>Before</figcaption>
        </figure>
        <figure>
          <img class="kw-photo-fix__image" data-image="after" alt="Your photo after">
          <figcaption>After</figcaption>
        </figure>
      </div>
      <p class="kw-photo-fix__text" data-note></p>
      <div class="kw-photo-fix__actions">
        <button type="button" class="kw-photo-fix__button kw-photo-fix__button--main" data-action="post">Post this photo</button>
        <button type="button" class="kw-photo-fix__button" data-action="save">Save to my computer</button>
        <button type="button" class="kw-photo-fix__button" data-action="restart">Fix another photo</button>
      </div>
    </div>

    <div data-step="error">
      <p class="kw-photo-fix__text" data-error></p>
      <div class="kw-photo-fix__actions">
        <button type="button" class="kw-photo-fix__button kw-photo-fix__button--main" data-action="retry">Try again</button>
        <button type="button" class="kw-photo-fix__button" data-action="restart">Choose a different photo</button>
      </div>
    </div>
  </div>
</div>
